      </g>
      <g class="eyes eyes-sad" style="display:none">
        <g class="eye">
          <ellipse cx="198" cy="208" rx="20" ry="19" fill="#ffffff" stroke="#081a34" stroke-width="3.5"/>
          <circle cx="201" cy="213" r="9" fill="#20356d"/>
          <circle cx="201" cy="213" r="4.5" fill="#0d1730"/>
          <circle cx="204" cy="209" r="2.4" fill="#ffffff"/>
