      <stop offset=".5" stop-color="#7b4bd6"/>
      <stop offset="1" stop-color="#4a2490"/>
    </linearGradient>
    <linearGradient id="orbit-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173b57"/>
      <stop offset="1" stop-color="#071a2c"/>
    </linearGradient>
    <radialGradient id="orbit-glow" cx=".5" cy=".5" r=".5">
