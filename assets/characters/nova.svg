          <ellipse cx="262" cy="202" rx="23" ry="28" fill="#ffffff" stroke="#081a34" stroke-width="3.5"/>
          <circle cx="265" cy="205" r="8" fill="#20356d"/>
          <circle cx="265" cy="205" r="4" fill="#0d1730"/>
          <circle cx="268" cy="201" r="2.6" fill="#ffffff"/>
