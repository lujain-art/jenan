    <linearGradient id="nova-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff8e6"/>
      <stop offset=".42" stop-color="#1aa8d4"/>
      <stop offset="1" stop-color="#0a3a76"/>
    </linearGradient>
    <linearGradient id="nova-suit-dark" x1="0" y1="0" x2="0" y2="1">
